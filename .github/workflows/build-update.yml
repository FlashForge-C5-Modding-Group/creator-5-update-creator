name: Build Creator 5 Pro update

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      filename:
        description: Encrypted output filename
        required: true
        default: Creator5Pro-1.9.7-1.2.9-20260810.tgz
      components:
        description: Comma list or all (software must be included)
        required: true
        default: all
      mcu_mode:
        description: Preserve vendor MCU HEX or use rebuilt ffklipper13 HEX
        type: choice
        options: [preserve, replacement]
        default: replacement

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_FILENAME: ${{ inputs.filename || 'Creator5Pro-1.9.7-1.2.9-20260810.tgz' }}
      COMPONENTS: ${{ inputs.components || 'all' }}
      MCU_MODE: ${{ inputs.mcu_mode || 'replacement' }}
    steps:
      - name: Check out project and source submodules
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive
          fetch-depth: 0

      - name: Install cross-build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-arm-none-eabi gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            openssl squashfs-tools xz-utils

      - name: Test update builder
        run: python3 -m unittest discover -s tests -v

      - name: Build replacement MCU images
        if: env.MCU_MODE == 'replacement'
        run: |
          chmod +x sources/ffklipper13/scripts/build-flashforge-mcus.sh
          JOBS=4 sources/ffklipper13/scripts/build-flashforge-mcus.sh all

      - name: Use repository kernel without rebuilding rootfs
        if: env.COMPONENTS == 'all' || contains(env.COMPONENTS, 'kernel')
        run: |
          OTA_DIR=sources/firmware-archive/kernel/ota_kernel_emmc/ota_v1
          mv "$OTA_DIR/rootfs_extracted" \
            "$RUNNER_TEMP/firmware-archive-rootfs-extracted"
          sed -i '/^img_type=rootfs$/,+4d' "$OTA_DIR/ota_update.in"
          find "$OTA_DIR" -maxdepth 1 -type f \
            -name 'ota_md5_rootfs.squashfs.*' -delete

      - name: Build and self-verify encrypted update
        run: |
          python3 scripts/build_update.py \
            --klipper sources/ffklipper13 \
            --updates sources/firmware-archive \
            --template template \
            --output-dir dist \
            --filename "$OUTPUT_FILENAME" \
            --components "$COMPONENTS" \
            --mcu-mode "$MCU_MODE" \
            --c-helper-mode preserve

      - name: Upload encrypted update and provenance
        uses: actions/upload-artifact@v4
        with:
          name: creator5pro-update-${{ github.run_number }}
          path: |
            dist/*.tgz
            dist/*.sha256
            dist/*.manifest.json
          if-no-files-found: error
